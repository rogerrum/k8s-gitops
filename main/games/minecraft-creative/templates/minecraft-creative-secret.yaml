apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minecraft-creative-secret
  namespace: games
  labels:
    app.kubernetes.io/instance: {{ $.Release.Name }}  # Add this!
    app.kubernetes.io/part-of: {{ $.Release.Name }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: minecraft-creative-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        RCON_PASSWORD: '{{ printf "{{ .rcon_password }}" }}'
  dataFrom:
    - extract:
        key: minecraft-config
