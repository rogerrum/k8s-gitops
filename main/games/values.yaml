repo:
  url: https://github.com/rogerrum/k8s-gitops.git
  revision: main


applications:
  - name: minecraft-bedrock-survival
    namespace: games
    path: main/games/minecraft-bedrock-survival
    manifest-paths: /main/games/minecraft-bedrock-survival
    sync-wave: "0"
    helm:
      enabled: true

  - name: minecraft-bedrock-creative
    namespace: games
    path: main/games/minecraft-bedrock-creative
    manifest-paths: /main/games/minecraft-bedrock-creative
    sync-wave: "0"
    helm:
      enabled: true

  - name: minecraft-java-survival
    namespace: games
    path: main/games/minecraft-java-survival
    manifest-paths: /main/games/minecraft-java-survival
    sync-wave: "0"
    helm:
      enabled: true

  - name: minecraft-java-creative
    namespace: games
    path: main/games/minecraft-java-creative
    manifest-paths: /main/games/minecraft-java-creative
    sync-wave: "0"
    helm:
      enabled: true
