app-template:

  defaultPodOptions:
    securityContext:
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault

  controllers:
    main:
      pod:
        automountServiceAccountToken: true
      serviceAccount:
        identifier: minecraft-router
      containers:
        main:
          image:
            repository: itzg/mc-router
            tag: 1.47.2@sha256:64ae69eaa7a6800a79bbf962f027f4020878efa25183359115bc7f6ee569c36e
          args:
            - --in-kube-cluster
            - --auto-scale-up
            - --auto-scale-down
            - --auto-scale-down-after=12h
            - --connection-rate-limit=5
            - --api-binding=:25566
            - --metrics-backend=prometheus
            - --record-logins
          env:
            KUBE_NAMESPACE:
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            TZ: America/Chicago
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /routes
                  port: 25566
                  httpHeaders:
                    - name: Accept
                      value: application/json
                initialDelaySeconds: 10
                periodSeconds: 30
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /routes
                  port: 25566
                  httpHeaders:
                    - name: Accept
                      value: application/json
                initialDelaySeconds: 5
                periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true

  rbac:
    roles:
      minecraft-router:
        type: Role
        rules:
          - apiGroups: [""]
            resources: ["services"]
            verbs: ["watch", "list"]
          - apiGroups: ["apps"]
            resources: ["statefulsets"]
            verbs: ["watch", "list", "patch"]
          - apiGroups: ["apps"]
            resources: ["statefulsets/scale"]
            verbs: ["get"]
    bindings:
      minecraft-router:
        type: RoleBinding
        roleRef:
          identifier: minecraft-router
        subjects:
          - identifier: minecraft-router

  service:
    app:
      controller: main
      type: LoadBalancer
      externalTrafficPolicy: Cluster
      annotations:
        lbipam.cilium.io/ips: "192.168.100.106"
        gethomepage.dev/enabled: "true"
        gethomepage.dev/group: Games
        gethomepage.dev/name: Minecraft
      ports:
        minecraft:
          port: 25565
          protocol: TCP
    api:
      controller: main
      ports:
        api:
          port: 25566

  serviceAccount:
    minecraft-router: {}
