app-template:

  defaultPodOptions:
    terminationGracePeriodSeconds: 120
    securityContext:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      runAsGroup: 1000
      runAsNonRoot: true
      runAsUser: 1000

  configMaps:
    direct-auth-patch:
      data:
        # Geyser proxies Bedrock clients to this Paper server over a plain
        # local TCP connection (no BungeeCord/Velocity proxy protocol), so
        # Paper must NOT expect proxy-forwarded player info - otherwise
        # those connections fail auth. These patches force that off while
        # keeping ONLINE_MODE auth working normally.
        paper-direct-auth.json: |
          {
            "file": "/data/config/paper-global.yml",
            "ops": [
              { "$set": { "path": "$.proxies['bungee-cord']['online-mode']", "value": true, "value-type": "bool" } },
              { "$set": { "path": "$.proxies.velocity.enabled", "value": false, "value-type": "bool" } },
              { "$set": { "path": "$.proxies.velocity['online-mode']", "value": true, "value-type": "bool" } }
            ]
          }
        disable-bungee-forwarding.json: |
          {
            "file": "/data/spigot.yml",
            "ops": [
              { "$set": { "path": "$.settings.bungeecord", "value": false, "value-type": "bool" } }
            ]
          }
        prometheus-exporter-config.json: |
          {
            "file": "/data/plugins/PrometheusExporter/config.yml",
            "ops": [
              { "$set": { "path": "$.host", "value": "0.0.0.0" } },
              { "$set": { "path": "$.port", "value": 9940, "value-type": "int" } }
            ]
          }
        # Mojang permanently removed RakNet as of Bedrock 1.26.60 (Oct 2026)
        # - NetherNet (WebRTC) is now mandatory, and Geyser only supports it
        # from build 1237+ with this opt-in config flag. Signaling-address
        # should be the external LoadBalancer IP so Bedrock clients behind
        # NAT can reach it. NOTE: verify the exact generated key paths in
        # plugins/Geyser-Spigot/config.yml on first boot - Geyser's schema
        # may differ slightly by version.
        geyser-nethernet-patch.json: |
          {
            "file": "/data/plugins/Geyser-Spigot/config.yml",
            "ops": [
              { "$set": { "path": "$.bedrock.transport", "value": "nethernet" } },
              { "$set": { "path": "$.bedrock.signaling-address", "value": "192.168.100.61" } }
            ]
          }
    prometheus-exporter-config:
      data:
        config.yml: |
          host: 0.0.0.0
          port: 9940

  controllers:
    main:
      # Always-on: no mc-router in front of this server, so there is no
      # scale-to-zero/wake-on-connect behavior - replicas stay at 1.
      replicas: 1
      containers:
        main:
          image:
            repository: ghcr.io/itzg/minecraft-server
            tag: 2026.11.0@sha256:8d5080d8dcd0a2629c2e4f248678373a337a40537ad6ef2857c7dbcda6e3eadd
          env:
            EULA: "true"
            TYPE: PAPER
            # pinned: LATEST+experimental resolves forward to 26.3, which
            # some plugins (e.g. Prism) don't support yet
            VERSION: "26.2"
            DIFFICULTY: normal
            MODE: creative
            # offline/cracked mode: no Mojang/Microsoft auth check, so any
            # arbitrary name below works, and UUIDs are auto-derived locally
            # (MD5 of the name) - don't flip back to "true" later without
            # expecting player data/inventories tied to these UUIDs to reset.
            ONLINE_MODE: "false"
            OVERRIDE_SERVER_PROPERTIES: "true"
            MEMORY: 3072M
            USE_AIKAR_FLAGS: "true"
            MAX_TICK_TIME: "-1"
            PAUSE_WHEN_EMPTY_SECONDS: "300"
            OPS: UnbuiltSpace217
            WHITELIST: "UnbuiltSpace217"
            MOTD: "§b§lCreative§r\n§7Build freely"
            STOP_SERVER_ANNOUNCE_DELAY: "20"
            PATCH_DEFINITIONS: /patch-defs
            # bluemap: web map (route below); add more Modrinth plugin slugs as needed
            MODRINTH_PROJECTS: |
              bluemap
              nochatreports-spigot-paper
              nbtapi
              prism
            # Geyser + Floodgate (below): lets Bedrock clients (iPhone/iPad/
            # Switch/etc) join this Java server directly via NetherNet - no
            # separate router needed since there is no Java PC client to
            # route for.
            APPLY_EXTRA_FILES: |
              plugins<https://github.com/sladkoff/minecraft-prometheus-exporter/releases/download/v3.1.2/minecraft-prometheus-exporter-3.1.2.jar
              plugins/PrometheusExporter</prometheus-exporter-config/config.yml
              plugins<https://cdn.modrinth.com/data/hXiIvTyT/versions/nY6VN1XH/EssentialsX-2.22.0.jar
              plugins<https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot
              plugins<https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot
          envFrom:
            - secretRef:
                name: minecraft-java-creative-secret
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                exec:
                  command: ["mc-monitor", "status", "--host", "127.0.0.1", "--port", "25565"]
                initialDelaySeconds: 30
                periodSeconds: 5
                failureThreshold: 10
            readiness:
              enabled: true
              custom: true
              spec:
                exec:
                  command: ["mc-monitor", "status", "--host", "127.0.0.1", "--port", "25565"]
                initialDelaySeconds: 30
                periodSeconds: 5
                failureThreshold: 10
            startup:
              enabled: true
              custom: true
              spec:
                exec:
                  command: ["mc-monitor", "status", "--host", "127.0.0.1", "--port", "25565"]
                failureThreshold: 30
                periodSeconds: 10
          resources:
            requests:
              memory: 4Gi
              cpu: 250m
            limits:
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}

  persistence:
    data:
      # Reusing the original PVC from the pre-mc-router era - it was never
      # deleted when that app was removed, so the old world/data is intact.
      existingClaim: minecraft-creative-data
      globalMounts:
        - path: /data
    direct-auth-patch:
      type: configMap
      identifier: direct-auth-patch
      globalMounts:
        - path: /patch-defs
    prometheus-exporter-config:
      type: configMap
      identifier: prometheus-exporter-config
      globalMounts:
        - path: /prometheus-exporter-config/config.yml
          subPath: config.yml
          readOnly: true

  route:
    internal:
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/group: Games
        gethomepage.dev/name: Minecraft Java Creative Map
      parentRefs:
        - name: internal
          namespace: kube-system
          sectionName: https
      hostnames:
        - mccr-map.rsr.net
      rules:
        - matches:
            - path: {type: PathPrefix, value: /}
          backendRefs:
            - name: minecraft-java-creative
              port: 8100

  service:
    main:
      controller: main
      labels:
        minecraft.rsr.net/server-metrics: "true"
      ports:
        minecraft:
          port: 25565
          protocol: TCP
        rcon:
          port: 25575
        bluemap:
          port: 8100
        metrics:
          port: 9940
    # Dedicated LoadBalancer for Bedrock clients via Geyser/NetherNet.
    # Signaling happens over TCP 19132; actual gameplay traffic rides
    # WebRTC over UDP on the same port number.
    geyser:
      controller: main
      type: LoadBalancer
      annotations:
        lbipam.cilium.io/ips: "192.168.100.61"
      ports:
        signaling:
          port: 19132
          protocol: TCP
        bedrock:
          port: 19132
          protocol: UDP
