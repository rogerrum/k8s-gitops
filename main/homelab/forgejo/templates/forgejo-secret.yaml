apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-signing-key
  namespace: default
  labels:
    app.kubernetes.io/instance: {{ $.Release.Name }}  # Add this!
    app.kubernetes.io/part-of: {{ $.Release.Name }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: forgejo-signing-key
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ed25519: '{{ printf "{{ .forgejo_signing_private_key }}" }}'
        ed25519.pub: '{{ printf "{{ .forgejo_signing_public_key }}" }}'
  dataFrom:
    - extract:
        key: forgejo-config
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-oidc
  namespace: default
  labels:
    app.kubernetes.io/instance: {{ $.Release.Name }}  # Add this!
    app.kubernetes.io/part-of: {{ $.Release.Name }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name:  forgejo-oidc
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        key: '{{ printf "{{ .forgejo_client_id }}" }}'
        secret: '{{ printf "{{ .forgejo_client_secret }}" }}'
  dataFrom:
    - extract:
        key: pocket-id-config
---
# Hook-annotated (pre-install,pre-upgrade, earlier weight than
# init-db-job.yaml's Job) so it runs in the same PreSync phase as, and
# strictly before, the init-db Job -- which needs the Secret this produces.
# Plain (non-hook) resources like a normal ExternalSecret are only applied in
# the later, separate "Sync" phase, so without this the Job would always
# race ahead of its own secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-db
  namespace: default
  labels:
    app.kubernetes.io/instance: {{ $.Release.Name }}  # Add this!
    app.kubernetes.io/part-of: {{ $.Release.Name }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: forgejo-db
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DB_USERNAME: '{{ printf "{{ .forgejo_db_user }}" }}'
        DB_PASSWORD: '{{ printf "{{ .forgejo_db_password }}" }}'
  dataFrom:
    - extract:
        key: postgres-config
