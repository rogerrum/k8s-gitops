app-template:
  controllers:
    main:
      annotations:
        secret.reloader.stakater.com/reload: frigate-secret
        configmap.reloader.stakater.com/reload: frigate-configmap
      containers:
        main:
          image:
            repository: ghcr.io/blakeblackshear/frigate
            tag: 0.18.0@sha256:9678a83a76e4730ac7d9ea7428370e32ae656d6b312aaad30d6c69f3fef14d35
          env:
            TZ: "America/Chicago"
            #LIBVA_DRIVER_NAME: "radeonsi"
            #LIBVA_DRIVER_NAME: "i965"
        #  envFrom:
        #    - secretRef:
        #        name: frigate-secret
          probes:
            liveness: &probes
              enabled: true
              custom: false
              spec:
                httpGet:
                  path: /api/version
                  port: &port 5000
                initialDelaySeconds: 0
                periodSeconds: 10
                timeoutSeconds: 1
                failureThreshold: 3
            readiness: *probes
            startup:
              enabled: false
          securityContext:
            privileged: true
          resources:
            claims:
              - name: gpu
            requests:
              memory: 2000Mi
              cpu: 1500m
              generic-device-plugin/coral: 1
            limits:
              memory: 4000Mi
              generic-device-plugin/coral: 1
      pod:
        resourceClaims:
          - name: gpu
            resourceClaimTemplateName: frigate
  service:
    main:
      controller: main
      type: LoadBalancer
      loadBalancerIP: 192.168.100.51
      ports:
        http:
          port: *port
          primary: true
        rtsp:
          port: 8554
        go2rtc:
          port: 1984
        webrtc:
          port: 8555

  route:
    main:
      enabled: true
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/group: Home
        gethomepage.dev/icon: frigate
        gethomepage.dev/name: Frigate
      parentRefs:
        - name: internal
          namespace: kube-system
          sectionName: https
      hostnames:
        - frigate.rsr.net
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - name: frigate
              port: *port

  persistence:
    config:
      existingClaim: frigate-config
      globalMounts:
        - path: /config
    config-file:
      type: configMap
      name: frigate-configmap
      globalMounts:
        - path: /config/config.yml
          subPath: config.yml
          readOnly: true
    cache:
      type: emptyDir
      medium: Memory
      sizeLimit: 4Gi
      globalMounts:
#        - path: /tmp/cache
        - path: /dev/shm
    media:
      existingClaim: nas-media-pvc
      globalMounts:
        - path: /media

  rawResources:
    gpu:
      manifest:
        apiVersion: resource.k8s.io/v1
        kind: ResourceClaimTemplate
        spec:
          spec:
            devices:
              requests:
                - name: gpu
                  exactly:
                    deviceClassName: gpu.intel.com
