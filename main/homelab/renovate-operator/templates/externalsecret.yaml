---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-operator
  namespace: default
  labels:
    app.kubernetes.io/instance: {{ $.Release.Name }}  # Add this!
    app.kubernetes.io/part-of: {{ $.Release.Name }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: renovate-secret
    template:
      # See kubernetes/default/forgejo/externalsecret.yaml for why the `|` block scalar is needed.
      mergePolicy: Merge
      data:
        ssh_private_key: |
          {{ printf "{{ .ssh_private_key }}" }}
  data:
    - secretKey: RENOVATE_TOKEN
      remoteRef:
        key: renovate-config
        property: RENOVATE_TOKEN
    - secretKey: RENOVATE_GITHUB_COM_TOKEN
      remoteRef:
        key: renovate-config
        property: GH_COM_TOKEN
    - secretKey: ssh_private_key
      remoteRef:
        key: renovate-ssh-key
        property: private key
