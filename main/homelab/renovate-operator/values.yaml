renovate-operator:
  config:
    # Default (1800s/30min) was getting hit: our hostRules fix
    # (abortOnError:false + a 60s per-host timeout on any flaky external
    # registry, see renovatejob.yaml) makes runs tolerate/retry flaky hosts
    # instead of fast-aborting, so a full run across 254+ dependencies can
    # legitimately take longer than 30 minutes now. Without enough headroom,
    # Kubernetes' job-controller force-kills the pod on DeadlineExceeded,
    # which deletes the pod outright -- that's why the UI then shows
    # "Failed to load logs, the job may have been cleaned up already" (the
    # pod is really gone, not just GC'd by JOB_TTL_SECONDS_AFTER_FINISHED).
    defaultJobActiveDeadlineSeconds: 3600
  # The operator's own Go binary calls git.rsr.net directly (webhook-sync),
  # whose TLS cert is issued by the internal step-ca CA -- without this it
  # fails with "tls: failed to verify certificate: x509: certificate signed
  # by unknown authority". Go's SSL_CERT_FILE replaces the whole trust store
  # (unlike Node's NODE_EXTRA_CA_CERTS, which appends), so step-ca-bundle
  # must contain the full set (see infrastructure/trust-manager's
  # useDefaultCAs source), not just the step-ca cert alone.
  extraEnv:
    - name: SSL_CERT_FILE
      value: /etc/ssl/certs/step-ca-bundle.crt
  extraVolumes:
    - name: step-ca
      configMap:
        name: step-ca-bundle
  extraVolumeMounts:
    - name: step-ca
      mountPath: /etc/ssl/certs/step-ca-bundle.crt
      subPath: ca.crt
      readOnly: true
  # Exposed internally only, behind the "internal" gateway's auth proxy
  # (security: authenticated label) -- the renovate-operator UI has no
  # built-in auth, so it must not be reachable without that layer.
  route:
    enabled: true
    labels:
      security: "authenticated"
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/group: Tools
      gethomepage.dev/icon: renovate
      gethomepage.dev/name: Renovate
    parentRefs:
      - name: internal
        namespace: kube-system
    hostnames:
      - renovate.rsr.net
  webhook:
    enabled: true
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
    dashboard:
      enabled: true
      grafanaDashboard:
        allowCrossNamespaceImport: true
        folder: apps
        instanceSelector:
          matchLabels:
            dashboards: grafana
