app-template:
  defaultPodOptions:
    securityContext:
      fsGroup: 1001
      fsGroupChangePolicy: OnRootMismatch
      runAsGroup: 1001
      runAsNonRoot: true
      runAsUser: 1001
      seccompProfile:
        type: RuntimeDefault

  controllers:
    echo-server:
      containers:
        app:
          image:
            repository: ghcr.io/home-operations/echo
            tag: 0.2.7@sha256:b7742b1bfcf61d4f8ee47d91fbb299f11f71a6e316f8d4957cb1e8659a860a9c
          env:
            ECHO_HTTP_PORT: &port 8080
            ECHO_METRICS_PORT: &metrics-port 8081
            ECHO_METRICS_ENABLED: "true"
            ECHO_LOG_FORMAT: json
            ECHO_PRETTY_PRINT: "true"
            ECHO_KUBERNETES: "true"
            ECHO_POD_NAME:
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            ECHO_POD_NAMESPACE:
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            ECHO_POD_IP:
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            ECHO_NODE_NAME:
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          probes:
            liveness: &probes
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthz
                  port: *port
                initialDelaySeconds: 0
                periodSeconds: 10
                timeoutSeconds: 1
                failureThreshold: 3
            readiness: *probes
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthz
                  port: *port
                failureThreshold: 30
                periodSeconds: 5
          resources:
            requests:
              cpu: 5m
              memory: 64Mi
            limits:
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true

  service:
    app:
      controller: echo-server
      ports:
        http:
          port: *port
        metrics:
          port: *metrics-port

  serviceMonitor:
    app:
      endpoints:
        - port: metrics
          path: /metrics
          interval: 1m
          scrapeTimeout: 30s

  route:
    app:
      parentRefs:
        - name: public
          namespace: kube-system
          sectionName: https
      hostnames:
        - www.techbuzzworld.com
    internal:
      parentRefs:
        - name: internal
          namespace: kube-system
          sectionName: https
      hostnames:
        - www.rsr.net
