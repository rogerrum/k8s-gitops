apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: teslamate-secret
  namespace: default
  labels:
    app.kubernetes.io/instance: {{ $.Release.Name }}  # Add this!
    app.kubernetes.io/part-of: {{ $.Release.Name }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: teslamate-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Teslamate - reuses the shared mosquitto "mqtt" user/password
        # (same fields frigate/zigbee2mqtt already use) instead of its own
        # emqx_teslamate_user/emqx_teslamate_password pair.
        MQTT_USERNAME: '{{ printf "{{ .emqx_mqtt_user }}" }}'
        MQTT_PASSWORD: '{{ printf "{{ .emqx_mqtt_password }}" }}'
        ENCRYPTION_KEY: '{{ printf "{{ .teslamate_encryption_key }}" }}'
        DATABASE_PASS: '{{ printf "{{ .teslamate_password }}" }}'
        DATABASE_USER: '{{ printf "{{ .teslamate_username }}" }}'
  dataFrom:
    - extract:
        key: postgres-config
    - extract:
        key: teslamate-config
    - extract:
        key: emqx-config
