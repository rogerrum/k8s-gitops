app-template:

  controllers:
    teslamate:
      pod:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: storage
                      operator: DoesNotExist
        securityContext:
          fsGroup: 10000
          fsGroupChangePolicy: OnRootMismatch
          runAsGroup: 10000
          runAsNonRoot: true
          runAsUser: 10000
          seccompProfile:
            type: RuntimeDefault
      initContainers:
        init-db:
          image:
            repository: ghcr.io/onedr0p/postgres-init
            tag: 17.4@sha256:43dd04e91e861cf912378bad987afa168fa4f13d05528304907ad0aa351195d6
          env:
            - name: INIT_POSTGRES_HOST
              value: postgres-lb.kube-system.svc.cluster.local
            - name: INIT_POSTGRES_DBNAME
              value: teslamate
            - name: INIT_POSTGRES_SUPER_PASS
              valueFrom:
                secretKeyRef:
                  name: postgres-superuser-secret
                  key: password
            - name: INIT_POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: teslamate-secret
                  key: DATABASE_USER
            - name: INIT_POSTGRES_PASS
              valueFrom:
                secretKeyRef:
                  name: teslamate-secret
                  key: DATABASE_PASS
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true

      containers:
        main:
          image:
            repository: teslamate/teslamate
            tag: 4.3.0@sha256:516fc9f0a14369f541b1a70ff2f65dd9b57c2e01c1f533b6d43b375445404955
          env:
            TZ: "America/Chicago"
            DISABLE_MQTT: "false"
            MQTT_HOST: "emqx.default.svc.cluster.local"
            MQTT_PORT: 1883
            MQTT_HOME_ASSISTANT_DISCOVERY: "true"
            DATABASE_NAME: teslamate
            DATABASE_HOST: postgres-lb.kube-system.svc.cluster.local
          envFrom:
            - secretRef:
                name: teslamate-secret
          probes:
            liveness: &probes
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 4000
                initialDelaySeconds: 0
                periodSeconds: 30
                timeoutSeconds: 5
                failureThreshold: 3
            readiness: *probes
            # 4.1.0+ runs a one-time Ecto migration synchronously before the
            # HTTP server starts; give it headroom on this long-lived DB.
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /
                  port: 4000
                initialDelaySeconds: 0
                periodSeconds: 15
                timeoutSeconds: 5
                failureThreshold: 60
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true

          resources:
            requests:
              memory: 250Mi
              cpu: 50m
            limits:
              memory: 500Mi

  persistence:
    tmp:
      type: emptyDir
      globalMounts:
        - path: /tmp

  service:
    main:
      type: ClusterIP
      ports:
        http:
          port: &port 4000

  route:
    main:
      enabled: true
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/group: Home
        gethomepage.dev/icon: teslamate
        gethomepage.dev/name: Teslamate
      parentRefs:
        - name: internal
          namespace: kube-system
          sectionName: https
      hostnames:
        - teslamate.rsr.net
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - name: teslamate
              port: *port

  resources:
    requests:
      memory: 250Mi
      cpu: 50m
    limits:
      memory: 500Mi

