app-template:
  controllers:
    jellyfin:
      containers:
        app:
          image:
            repository: ghcr.io/jellyfin/jellyfin
            tag: 10.11.11
          probes:
            liveness:
              enabled: true
            readiness:
              enabled: true
#          resources:
#            limits:
#              cpu: 6
#              memory: 5Gi
#            requests:
#              cpu: 500m
#              memory: 5Gi
          securityContext:
            privileged: true
            runAsGroup: 0
            runAsUser: 0
  defaultPodOptions:
    nodeSelector:
      kubernetes.io/arch: amd64
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: storage
                  operator: DoesNotExist
  persistence:
    cache:
      type: emptyDir
    config:
      existingClaim: jellyfin-config
#    dri:
#      hostPath: /dev/dri
#      type: hostPath
    media:
      existingClaim: nas-media-pvc
  route:
    app:
      annotations:
        gethomepage.dev/description: Media Center
        gethomepage.dev/enabled: 'true'
        gethomepage.dev/group: Media
        gethomepage.dev/icon: jellyfin
        gethomepage.dev/name: Jellyfin
      hostnames:
        - jf.rsr.net
      parentRefs:
        - name: internal
          namespace: kube-system
          sectionName: https
  service:
    app:
      controller: jellyfin
      ports:
        http:
          port: 8096
