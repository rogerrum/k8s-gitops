

repo:
  url: https://github.com/rogerrum/k8s-gitops.git
  revision: main



applications:
  - name: ai
    namespace: ai
    create-namespace: true
    namespace-sync-wave: "-2"
    path: main/ai
    manifest-paths: /main/ai/templates;/main/ai/Chart.yaml;/main/ai/values.yaml
    sync-wave: "-1"
    helm:
      enabled: true

  - name: homelab
    namespace: argocd
    path: main/homelab
    manifest-paths: /main/homelab/templates;/main/homelab/Chart.yaml;/main/homelab/values.yaml
    sync-wave: "-1"
    helm:
      enabled: true

  - name: logs
    namespace: logs
    create-namespace: true
    namespace-sync-wave: "-2"
    path: main/logs
    manifest-paths: /main/logs/templates;/main/logs/Chart.yaml;/main/logs/values.yaml
    sync-wave: "-1"
    helm:
      enabled: true

  - name: monitoring
    namespace: monitoring
    create-namespace: true
    namespace-sync-wave: "-3"
    path: main/monitoring
    manifest-paths: /main/monitoring/templates;/main/monitoring/Chart.yaml;/main/monitoring/values.yaml
    sync-wave: "-2"
    helm:
      enabled: true
    ignoreDifferences:
      - group: argoproj.io
        kind: Application
        jqPathExpressions:
          # ArgoCD itself adds pre-delete-finalizer.argocd.argoproj.io
          # finalizers to child Applications whose chart has delete hooks
          # (e.g. victoria-metrics); they aren't declared in git, so
          # ignore them to avoid perpetual OutOfSync.
          - '.metadata.finalizers'

  - name: local
    namespace: argocd
    repoURL: http://forgejo-http.default.svc.cluster.local:3000/roger/k8s-gitops-local.git
    targetRevision: main
    path: local
    manifest-paths: /local/templates;/local/Chart.yaml;/local/values.yaml
    sync-wave: "1"
    helm:
      enabled: true
