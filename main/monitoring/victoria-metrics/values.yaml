victoria-metrics-k8s-stack:
  fullnameOverride: stack
  victoria-metrics-operator:
    enabled: true
    env:
      - name: VM_VMALERTDEFAULT_CONFIGRELOADERCPU
        value: 0
      - name: VM_VMAGENTDEFAULT_CONFIGRELOADERCPU
        value: 0
      - name: VM_VMALERTMANAGER_CONFIGRELOADERCPU
        value: 0
    operator:
      disable_prometheus_converter: false # Ensure we keep enabled the converter to sync prom rules to VM rules
      enable_converter_ownership: true # Required to allow VM to remove VM rules it imports if a prometheus rule is deleted

  defaultDashboards:
    enabled: true
    grafanaOperator:
      enabled: true
      spec:
        instanceSelector:
          matchLabels:
            dashboards: grafana
        folder: monitoring   # explicit; previously implied by CR namespace


  defaultRules:
    create: true
    rules:
      # Disabled because NFS zero-scalers intentionally run at maxReplicas=1
      KubeHpaMaxedOut:
        create: false
      # Disabled: upstream expr (count(up == 0) without(...)) returns empty
      # (not zero) when nothing is down, which RecordingRulesNoData reads as
      # NoData and alerts on. Replaced by a fixed version in prometheus-rules/
      # (adds "or vector(0)" so it always returns data).
      "count:up0":
        create: false
      # Disabled; replaced by prometheus-rules/vmalert-meta.yaml
      AlertingRulesError:
        create: false
      RecordingRulesError:
        create: false
    groups:
      # renamed from k8sContainerMemorySwap (upstream key change in chart 0.85.0)
      k8s.rules.container_memory_swap:
        create: false
      # Disabled because kube-scheduler metrics produce no useful data
      # (scheduler is mostly idle, histogram_quantile returns empty results)
      kube-scheduler.rules:
        create: false

  vmsingle:
    enabled: true
    spec:
      # -- Data retention period. Possible units character: h(ours), d(ays), w(eeks), y(ears), if no unit character specified - month. The minimum retention period is 24h. See these [docs](https://docs.victoriametrics.com/single-server-victoriametrics/#retention)
      retentionPeriod: "1"
      replicaCount: 1
      storage:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 60Gi
      resources:
        limits:
          memory: 4Gi
        requests:
          cpu: 1000m
          memory: 2Gi
      # kube-apiserver SLO burn-rate/availability recording rules run heavy
      # 30d-range queries (vmalert -> vmsingle) that routinely take 5-20s.
      # This tripped both the default 5s slow-query logging threshold
      # (flooding logs -> TooManyLogs alert) and occasionally the 30s query
      # timeout. Raise both so legitimate-but-slow queries don't generate
      # log noise or fail outright.
      extraArgs:
        memory.allowedPercent: "75"
        # default (2x node CPUs = 16) gets exceeded when vmalert's ~90+ rule
        # groups tick at once, causing bursts of 429s that flap
        # AlertingRulesError/RecordingRulesError
        search.maxConcurrentRequests: "32"
        search.logSlowQueryDuration: 30s
        search.maxUniqueTimeseries: "300000"
        search.maxQueryDuration: 60s
      # Keep vmsingle off control-plane and storage nodes: it can burst well
      # above its CPU request (no CPU limit set) and was starving the
      # Longhorn engine + other pods co-located on k8s-3/4/5-storage.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
                  - key: node-role.kubernetes.io/master
                    operator: DoesNotExist
                  - key: storage
                    operator: DoesNotExist

    route:
      enabled: true
      annotations:
        gethomepage.dev/enabled: 'true'
        gethomepage.dev/group: Monitoring
        gethomepage.dev/icon: sh-victoriametrics
        gethomepage.dev/name: VM
      parentRefs:
        - name: internal
          namespace: kube-system
          group: gateway.networking.k8s.io
          kind: Gateway
      hostnames:
        - vm.rsr.net
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - name: vmsingle-stack
              port: 8428

  
  alertmanager:
    enabled: true
    spec:
      externalURL: "https://vm-alert.rsr.net"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
                  - key: node-role.kubernetes.io/master
                    operator: DoesNotExist
                  - key: storage
                    operator: DoesNotExist
    route:
      enabled: true
      annotations:
        gethomepage.dev/enabled: 'true'
        gethomepage.dev/group: Monitoring
        gethomepage.dev/icon: prometheus
        gethomepage.dev/name: Alertmanager
      parentRefs:
        - name: internal
          namespace: kube-system
          group: gateway.networking.k8s.io
          kind: Gateway
      hostnames:
        - vm-alert.rsr.net
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - name: vmalertmanager-stack
              port: 9093

    config:
      route:
        group_by: ["alertname", "job"]
        group_wait: 30s
        group_interval: 10m
        repeat_interval: 12h
        routes:
          # Route 1: Blackhole for noise
          - matchers:
              - alertname=~"WatchDog|InfoInhibitor|KubeMemoryOvercommit"
            receiver: 'blackhole'
#          - receiver: pagerduty
#            matchers:
#              - severity=~"critical"
#            continue: true
          - receiver: discord-notifications
            matchers:
              - severity=~"warning|critical"
      inhibit_rules:
        - source_matchers:
            - severity = "critical"
          target_matchers:
            - severity =~ "warning|info"
          equal: [ 'namespace', 'alertname' ]
        - source_matchers:
            - severity = "warning"
          target_matchers:
            - severity = "info"
          equal: [ 'namespace', 'alertname' ]
        - source_matchers:
            - alertname = "InfoInhibitor"
          target_matchers:
            - severity = "info"
          equal: [ 'namespace' ]
        - target_matchers:
            - alertname = "InfoInhibitor"
            -
      receivers:
        - name: 'blackhole'
        - name: 'discord-notifications'
          webhook_configs:
            - url: 'http://alertmanager-discord:9094'
        - name: pagerduty
          pagerduty_configs:
            - routing_key: '{{ template "pagerduty.custom.routing.key" . }}'
              description: |-
                {{ template "pagerduty.custom.description" . }}

    templateFiles:
      pagerduty-custom.tmpl: |-
        {{- define "pagerduty.custom.description" -}}[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ if ne .CommonAnnotations.summary ""}}{{ .CommonAnnotations.summary }} {{ else if ne .CommonAnnotations.message ""}}{{ .CommonAnnotations.message }} {{ else if ne .CommonAnnotations.description ""}}{{ .CommonAnnotations.description }} {{ else }}{{ .CommonLabels.alertname }}{{ end }}{{- end -}}
      pagerduty-custom-keys.tmpl: |-
        {{- define "pagerduty.custom.routing.key" -}}` }}111{{- end -}}


  vmalert:
    enabled: true
    spec:
      extraArgs:
        external.url: "https://vmalert.rsr.net"
      evaluationInterval: 15s
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
                  - key: node-role.kubernetes.io/master
                    operator: DoesNotExist
                  - key: storage
                    operator: DoesNotExist
      resources:
        limits:
          cpu: 500m
    route:
      enabled: true
      annotations:
        gethomepage.dev/enabled: 'true'
        gethomepage.dev/group: Monitoring
        gethomepage.dev/icon: prometheus
        gethomepage.dev/name: VMalert
      parentRefs:
        - name: internal
          namespace: kube-system
          group: gateway.networking.k8s.io
          kind: Gateway
      hostnames:
        - vmalert.rsr.net
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - name: vmalert-stack
              port: 8080
  
  vmagent:
    enabled: true
    route:
      enabled: true
      annotations:
        gethomepage.dev/enabled: 'true'
        gethomepage.dev/group: Monitoring
        gethomepage.dev/icon: sh-victoriametrics
        gethomepage.dev/name: vmagent
      parentRefs:
        - name: internal
          namespace: kube-system
          group: gateway.networking.k8s.io
          kind: Gateway
      hostnames:
        - vmagent.rsr.net
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - name: vmagent-stack
              port: 8429

    spec:
      # kube-apiserver's /metrics response exceeds vmagent's default 16MB
      # promscrape.maxScrapeSize, causing that target to permanently fail
      # (TargetDown). Raise the limit cluster-wide to accommodate it.
      extraArgs:
        promscrape.dropOriginalLabels: "true"
        promscrape.streamParse: "true"
        promscrape.maxScrapeSize: 50MiB
      scrapeInterval: 20s
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
                  - key: node-role.kubernetes.io/master
                    operator: DoesNotExist
                  - key: storage
                    operator: DoesNotExist
      additionalScrapeConfigs:
        name: victoria-metrics-secret
        key: additionalScrapeConfigs
      inlineScrapeConfig: |
        - job_name: 'pushgateway'
          scrape_interval: 60s
          static_configs:
            - targets: [ 'pushgateway.monitoring.svc:9091' ]

      resources:
        limits:
          #cpu: null
          memory: 900Mi
        requests:
          cpu: 500m
          memory: 400Mi

  grafana:
    enabled: false
  
  prometheus-node-exporter:
    enabled: true

  
  kube-state-metrics:
    enabled: true
  
  kubelet:
    enabled: true
    vmScrape:
      spec:
        # drop high cardinality label and useless metrics for cadvisor and kubelet
        metricRelabelConfigs:
          # Drop less useful container CPU metrics.
          - sourceLabels: [__name__]
            action: drop
            regex: 'container_cpu_(cfs_throttled_seconds_total|load_average_10s|system_seconds_total|user_seconds_total)'
          # Drop less useful / always zero container memory metrics.
          - sourceLabels: [__name__]
            action: drop
            regex: 'container_memory_(failures_total|mapped_file|swap)'
          # Drop less useful container process metrics.
          - sourceLabels: [__name__]
            action: drop
            # regex: 'container_(file_descriptors|tasks_state|threads_max)'
            regex: 'container_(tasks_state|threads_max)'
          # Drop less useful container filesystem metrics.
          - sourceLabels: [__name__]
            action: drop
            regex: 'container_fs_(io_current|io_time_seconds_total|io_time_weighted_seconds_total|reads_merged_total|sector_reads_total|sector_writes_total|writes_merged_total)'
          # Drop less useful container blkio metrics.
          - sourceLabels: [__name__]
            action: drop
            regex: 'container_blkio_device_usage_total'
          # Drop container spec metrics that overlap with kube-state-metrics.
          - sourceLabels: [__name__]
            action: drop
            regex: 'container_spec.*'
          # Drop cgroup metrics with no pod.
          - sourceLabels: [id, pod]
            action: drop
            regex: '.+;'
          - action: drop
            sourceLabels: [__name__]
            regex: prober_probe_duration_seconds_bucket
          # Drop high-cardinality labels.
          - action: labeldrop
            regex: (uid|id|name|pod_uid|interface)
          - action: drop
            sourceLabels: [__name__]
            regex: (rest_client_request_duration_seconds_bucket|rest_client_request_duration_seconds_sum|rest_client_request_duration_seconds_count)
  
  kubeApiServer:
    enabled: true
  
  kubeControllerManager:
    enabled: false

  coreDns:
    enabled: true
  
  kubeEtcd:
    enabled: false
  
  kubeScheduler:
    enabled: false

  kubeProxy:
    enabled: false
  
  prometheus-operator-crds:
    enabled: true  
