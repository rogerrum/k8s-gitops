{{- range .Values.linkDashboards }}
---
# yaml-language-server: $schema=https://k8s-schemas.bjw-s.dev/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: {{ .name }}
  namespace: monitoring
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folder: {{ .folder }}
  url: {{ .url }}
  {{- if .datasources }}
  datasources:
    {{- range .datasources }}
    - inputName: {{ .inputName }}
      datasourceName: {{ .datasourceName }}
    {{- end }}
  {{- end }}
{{- end }}
