---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Labeler

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  main:
    name: Labeler
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-slim
    steps:
      - name: Labeler
        uses: https://github.com/actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .forgejo/labeler.yaml
