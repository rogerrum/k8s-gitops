---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Labeler

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
  pull_request:
    branches: ["main"]

# No `permissions:` block: Forgejo Actions doesn't support the GitHub
# Actions permissions field (silently ignored -- see the "has a permissions
# field, which is not supported in Forgejo" workflow warning). Write access
# for the labeler action comes from the repo/instance's own Actions token
# settings (Settings > Actions > General > default token permission).

jobs:
  main:
    name: Labeler
    runs-on: ubuntu-slim
    steps:
      - name: Labeler
        uses: https://github.com/actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .forgejo/labeler.yaml
