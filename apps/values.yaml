repo:
  url: https://github.com/rogerrum/k8s-gitops.git
  revision: main


applications:
  - name: argocd
    app-namespace: argocd
    namespace: argocd
    path: argocd
    manifest-paths: /argocd
    sync-wave: "-5"
    syncOptions:
      - ServerSideApply=true
    ignoreDifferences:
      - group: external-secrets.io
        kind: ExternalSecret
        jqPathExpressions:
          - '.spec.dataFrom[].extract.conversionStrategy'
          - '.spec.dataFrom[].extract.decodingStrategy'
          - '.spec.dataFrom[].extract.metadataPolicy'

  - name: infrastructure
    namespace: argocd
    path: infrastructure/
    manifest-paths: /infrastructure/templates;/infrastructure/Chart.yaml;/infrastructure/values.yaml
    sync-wave: "-4"
    ignoreDifferences:
      - group: argoproj.io
        kind: Application
        jqPathExpressions:
          # ArgoCD itself adds pre-delete/post-delete-finalizer.argocd.argoproj.io
          # finalizers to child Applications whose chart has delete hooks
          # (e.g. kyverno, longhorn, node-feature-discovery); they aren't
          # declared in git, so ignore them to avoid perpetual OutOfSync.
          - '.metadata.finalizers'

  - name: main
    namespace: argocd
    path: main/
    manifest-paths: /main/templates;/main/Chart.yaml;/main/values.yaml
    sync-wave: "-3"

  - name: root
    app-namespace: argocd
    namespace: argocd
    path: apps
    manifest-paths: /apps

  - name: system-upgrade
    namespace: system-upgrade
    path: system-upgrade/
    manifest-paths: /system-upgrade
    sync-wave: "-4"
    syncOptions:
      - CreateNamespace=true
