---
# ExternalSecret for Kopiur repository password
# Reuses same 1Password item (kopia-config) as existing VolSync secrets
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-nas
  namespace: kube-system
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kopiur-nas-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        KOPIA_PASSWORD: "{{ printf "{{ .KOPIA_PASSWORD }}" }}"
  dataFrom:
    - extract:
        key: kopia-config
