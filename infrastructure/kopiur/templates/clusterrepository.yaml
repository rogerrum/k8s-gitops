---
# ClusterRepository targeting the existing NFS Kopia repo at 192.168.1.115:/Kopia
# No `create` block — adopt the existing repo in place, never risk reinitializing.
#
# Identity expressions reproduce the fork's recorded identity exactly:
#   hostnameExpr: "namespace" + usernameExpr: "policyName"
#   + sourcePathOverride: /data on every SnapshotPolicy source
# = <app>@<namespace>:/data — same as current VolSync snapshots
# This means existing backup history is preserved and continues as one series.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: nas
  namespace: kube-system
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # Bootstrap timeout — raised to 3600s (1h) because circuit breaker opened after 1800s.
  # 294 index blobs still too slow to connect overnight. Lower once blob count < 100.
  bootstrap:
    failurePolicy:
      activeDeadlineSeconds: 3600
  allowedNamespaces:
    all: true
  backend:
    filesystem:
      path: /repository
      volume:
        nfs:
          server: 192.168.1.115
          path: /Kopia
  encryption:
    passwordSecretRef:
      name: kopiur-nas-secret
      namespace: kube-system
      key: KOPIA_PASSWORD
  identityDefaults:
    # Reproduces the perfectra1n fork's recorded identity exactly:
    # <app>@<namespace>:/data = username=policyName, hostname=namespace
    # e.g. actual@default:/data → username=actual, hostname=default
    hostnameExpr: "namespace"
    usernameExpr: "policyName"
  credentialProjection:
    allowed: true
  scheduleDefaults:
    timezone: America/Chicago
  catalog:
    fallbackNamespace: kube-system
    retain:
      perIdentity: 30
  parameters:
    epoch:
      # Backlog compacted (indexBlobCount now 46, well under the 100 threshold
      # that justified the temporary 10m setting) — raised back to the normal 1h.
      minDuration: 1h
  maintenance:
    # Force takeover from old KopiaMaintenance lease owner (volsync perfectra1n fork).
    # Remove after first successful Kopiur maintenance run.
    takeoverPolicy: Force
    # Schedule reduced from every-3h quick + daily full (8-9 NFS mount/unmount
    # cycles/day) down to VolSync's original cadence (was a single weekly job) —
    # same NFS-wedge root cause as the per-app schedules (see values.yaml comment
    # in kopiur-apps). Placed in dedicated slots that stay clear of every app's
    # backup/verification window (see kopiur-apps/values.yaml's 00/06/12/18 grid):
    #   quick — daily 21:00, the one hour free on every day of the week
    #   full  — weekly Saturday 18:00, the only day with a wide-open evening
    schedule:
      quick:
        cron: "0 21 * * *"
        jitter: 30m
      full:
        cron: "0 18 * * 6"
        jitter: 1h
    mover:
      cache:
        capacity: 20Gi
        storageClassName: longhorn
        metadataCacheSizeMb: 5120
        contentCacheSizeMb: 2048
      resources:
        requests:
          cpu: 200m
          memory: 1Gi
  moverDefaults:
    securityContext:
      runAsUser: 1001
      runAsGroup: 1001
    podSecurityContext:
      runAsNonRoot: true
      fsGroup: 1001
      fsGroupChangePolicy: OnRootMismatch
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - k8s-12-worker
                    # Single-node pin avoids the Longhorn Immediate-binding race entirely
                    # (only one candidate node, so the staging PVC always lands where the
                    # mover pod does). k8s-12 chosen over k8s-8 (Frigate + Longhorn CPU
                    # contention, load avg 13+/4 cores) and k8s-11 (Longhorn engine-image
                    # crash-looping). Revisit if k8s-12 CPU/Longhorn health degrades.
      # podAntiAffinity (one kopiur pod at a time on this node) intentionally
      # removed: the CRD applies this same rule uniformly to every kopiur pod
      # type (mover/verify/discovery/snapdel/maintenance), so housekeeping
      # jobs that never stage an app PVC (discovery, snapdel) were queuing
      # behind unrelated, slow verify/mover pods with no way to exempt them.
      # Now that the schedule is spread across the full 24h (see
      # kopiur-apps/values.yaml) simultaneous heavy jobs should be rare. If
      # the node does get overloaded/wedged from real concurrent stacking,
      # see scripts/UNWEDGE-NFS-NODE.md / scripts/unwedge-nfs-node.sh for
      # manual recovery (no reboot needed in the cases seen so far).
      # Revisit (re-add a required podAntiAffinity) if this proves unstable.
    cache:
      capacity: 3Gi
      storageClassName: longhorn
      mode: Persistent
      metadataCacheSizeMb: 400
      contentCacheSizeMb: 200
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
    ttlSecondsAfterFinished: 300
