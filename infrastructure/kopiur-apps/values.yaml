# Kopiur backup configuration
# createPVCs: false = only SnapshotPolicy/Schedule (existing VolSync PVCs untouched)
# createPVCs: true  = also manage PVC bootstrap via Restore populator
createPVCs: false

defaults:
  pvcSuffix: config
  runAsUser: "1001"
  capacity: 1Gi
  cacheCapacity: "3Gi"
  # H = Jenkins-style cron: kopiur hashes a stable per-app minute for load distribution
  schedule: "H * * * *"
  namespace: default

# Schedule strategy:
#   LARGE apps (home-assistant, forgejo, ss-models ~5-10Gi): every 6h, staggered by hour
#     so they never overlap: HA=H 0/6, forgejo=H 2/6, ss-models=H 4/6
#   MEDIUM apps (actual, frigate, node-red, paperless, manyfold ~3-5Gi): every 4h
#   SMALL apps (<1Gi): every 1-2h — fast, low NFS impact
#   All movers land on k8s-8-server; H jitter spreads the exact minute per-app

apps:
  # --- PILOT (verified working) ---
  - app: actual
    pvcSuffix: data
    capacity: 5Gi
    schedule: "H */4 * * *"

  # --- PHASE 2a — SMALL apps (<1Gi, hourly) ---
  - app: esphome
    schedule: "H * * * *"
    ignoreFileErrors: true  # some files owned by uid 2000 (device-builder), not readable by mover uid 1001

  - app: zigbee2mqtt
    schedule: "H * * * *"

  - app: zwavejs2mqtt
    schedule: "H * * * *"

  - app: matter-server
    pvcSuffix: data
    schedule: "H * * * *"
    ignoreFileErrors: true  # chip_counters.ini and json files owned by different uid

  - app: mealie
    pvcSuffix: api-data
    schedule: "H * * * *"

  - app: planka
    pvcSuffix: data
    schedule: "H * * * *"

  - app: webtrees
    schedule: "H * * * *"
    ignoreFileErrors: true  # config.ini.php owned by different uid, not readable by mover uid 1001

  - app: uptime-kuma
    pvcSuffix: data
    capacity: 5Gi
    namespace: monitoring
    schedule: "H * * * *"

  - app: pocket-id
    pvcSuffix: data
    namespace: kube-system
    schedule: "H * * * *"

# PHASE 2b — MEDIUM (every 4h) — uncomment after 2a verified:
  - app: frigate
    capacity: 10Gi
    schedule: "H */4 * * *"

  - app: node-red
    pvcSuffix: data
    capacity: 5Gi
    schedule: "H */4 * * *"

  - app: paperless-ngx
    pvcSuffix: data
    capacity: 5Gi
    schedule: "H */4 * * *"

  - app: manyfold
    pvcSuffix: data
    capacity: 5Gi
    schedule: "H */4 * * *"

  - app: jellyfin
    capacity: 3Gi
    schedule: "H */4 * * *"

  - app: streambox
    pvcSuffix: data
    schedule: "H */4 * * *"

# PHASE 2c — LARGE (every 6h, staggered) — uncomment after 2b verified:
  - app: home-assistant
    capacity: 10Gi
    cacheCapacity: "5Gi"
    schedule: "H 0/6 * * *"

  - app: forgejo
    capacity: 10Gi
    cacheCapacity: "5Gi"
    runAsUser: "1000"    # forgejo git user uid=1000; /data/gitea is drwx------ 1000:1000
    schedule: "H 2/6 * * *"

  - app: ss-models
    pvcSuffix: data
    capacity: 10Gi
    cacheCapacity: "5Gi"
    schedule: "H 4/6 * * *"
