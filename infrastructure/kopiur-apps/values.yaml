# Kopiur backup configuration
# createPVCs: false = only SnapshotPolicy/Schedule (existing VolSync PVCs untouched)
# createPVCs: true  = also manage PVC bootstrap via Restore populator
createPVCs: false

defaults:
  pvcSuffix: config
  runAsUser: "1001"
  capacity: 1Gi
  cacheCapacity: "3Gi"
  # H = Jenkins-style cron: kopiur hashes a stable per-app minute for load distribution
  # Default: daily at a stable hashed time (low frequency, NFS+single-node friendly)
  schedule: "H H * * *"
  namespace: default

# Schedule strategy (NFS + Garage S3 + single k8s-8-server node):
#   CRITICAL / frequently changing (HA, forgejo, actual): every 6h, staggered by hour
#   MEDIUM change rate (node-red, paperless, mealie, planka, zigbee, zwave, matter, webtrees): every 12h
#   SLOW / large / rarely changes (frigate, jellyfin, ss-models, streambox, manyfold, esphome): daily
#   LOW / monitoring/infra (uptime-kuma, pocket-id): daily
#   Stagger hours so large apps never overlap; H jitter spreads exact minute per-app

apps:
  # --- PILOT (verified working) ---
  - app: actual
    pvcSuffix: data
    capacity: 5Gi
    schedule: "H */6 * * *"        # every 6h — financial data, frequently updated

  # --- PHASE 2a — SMALL/MEDIUM apps ---
  - app: esphome
    schedule: "H H * * *"          # daily — device configs rarely change
    runAsUser: "2000"               # esphome device-builder files owned by uid 2000; other-owned files are world-readable (o+r)

  - app: zigbee2mqtt
    schedule: "H */12 * * *"       # every 12h — device state changes regularly

  - app: zwavejs2mqtt
    schedule: "H */12 * * *"       # every 12h — device state changes regularly

  - app: matter-server
    pvcSuffix: data
    schedule: "H */12 * * *"       # every 12h
    runAsUser: "0"                   # matter-server itself runs as root (see main/homelab/matter-server); mover must match

  - app: mealie
    pvcSuffix: api-data
    schedule: "H */12 * * *"       # every 12h — recipes added occasionally

  - app: planka
    pvcSuffix: data
    schedule: "H */12 * * *"       # every 12h — project board updates

  - app: webtrees
    schedule: "H */12 * * *"       # every 12h — genealogy data changes
    runAsUser: "33"                  # webtrees data owned by www-data (uid 33); config.ini.php is 0700

  - app: uptime-kuma
    pvcSuffix: data
    capacity: 5Gi
    namespace: monitoring
    schedule: "H H * * *"          # daily — monitoring config rarely changes

  - app: pocket-id
    pvcSuffix: data
    namespace: kube-system
    schedule: "H H * * *"          # daily — identity provider config rarely changes

  # --- PHASE 2b — MEDIUM apps ---
  - app: frigate
    capacity: 10Gi
    schedule: "H H * * *"          # daily — NVR config rarely changes, clips not backed up

  - app: node-red
    pvcSuffix: data
    capacity: 5Gi
    schedule: "H */12 * * *"       # every 12h — automation flows change regularly

  - app: paperless-ngx
    pvcSuffix: data
    capacity: 5Gi
    schedule: "H */12 * * *"       # every 12h — documents ingested regularly

  - app: manyfold
    pvcSuffix: data
    capacity: 5Gi
    schedule: "H H * * *"          # daily — 3D model library rarely changes

  - app: jellyfin
    capacity: 3Gi
    schedule: "H H * * *"          # daily — media server config/metadata

  - app: streambox
    pvcSuffix: data
    schedule: "H H * * *"          # daily

  # --- PHASE 2c — LARGE apps (staggered 6h, never overlap) ---
  - app: home-assistant
    capacity: 10Gi
    cacheCapacity: "5Gi"
    runAsUser: "1000"               # HA container runs as uid=1000; mover must match to read .storage/* files
    schedule: "H 0/6 * * *"        # every 6h at hours 0,6,12,18 — automation state critical

  - app: forgejo
    capacity: 10Gi
    cacheCapacity: "5Gi"
    runAsUser: "1000"               # forgejo /data owned by uid=1000 (git); matches so mover can read git/.ssh (0700) too
    schedule: "H 2/6 * * *"        # every 6h at hours 2,8,14,20 — git repos, offset from HA

  - app: ss-models
    pvcSuffix: data
    capacity: 10Gi
    cacheCapacity: "5Gi"
    schedule: "H H * * *"          # daily — AI models rarely change
