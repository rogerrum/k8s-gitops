# Kopiur backup configuration
# createPVCs: false = only SnapshotPolicy/Schedule (existing VolSync PVCs untouched)
# createPVCs: true  = also manage PVC bootstrap via Restore populator
createPVCs: false

defaults:
  pvcSuffix: config
  runAsUser: "1001"
  capacity: 1Gi
  cacheCapacity: "3Gi"
  # H = Jenkins-style cron: kopiur hashes a stable per-app minute for load distribution
  # Default: daily at a stable hashed time (low frequency, NFS+single-node friendly)
  schedule: "H H * * *"
  namespace: default
  # Verification is opt-in per app (set `verifyEnabled: true` on an app
  # below to turn it on for just that one) — see the comment in
  # templates/snapshots.yaml for why it defaults to off cluster-wide.
  verifyEnabled: false

# Schedule strategy — REVERTED to VolSync's original, proven-stable cadence.
#
# Root cause (2026-09-02): pinning all kopiur movers to one node (to avoid a
# Longhorn multi-attach race) concentrates every app's NFS mount/unmount onto
# that single node's kernel NFS client. The earlier 6h/12h-everywhere
# schedule plus a separate daily per-app verification job pushed that one
# node to 40-70+ NFS mount/unmount cycles/day — vs VolSync's ~2-4/day
# (mostly weekly, home-assistant daily) that ran fine for a long time. That
# much higher churn rate appears to eventually wedge the kernel's per-server
# NFS "manager" thread (visible as permanently D-state `mount.nfs` processes
# that only clear on node reboot) — almost certainly a NAS/kernel NFS-client
# edge case that low-frequency VolSync traffic essentially never triggered.
#
# Fix: restore each app's original VolSync-era schedule (below), and instead
# of a separate always-daily verification.quick job, verification now reuses
# each app's own backup `schedule` (see templates/snapshots.yaml) so it only
# ever runs alongside a backup — not as an independent extra mount/unmount.
#
# Schedules are per-app cron pulled 1:1 from the last-working VolSync
# values.yaml (git commit 6a1ff71d) — home-assistant is daily, everything
# else is weekly on a specific day/time, verified to have zero collisions.

apps:
  # --- Daily — home-assistant (big PVC, backup can run well over an hour).
  # Isolated at 00:00 with a full 6h gap before the first weekly job of the
  # day (06:00), using a 24h quarter-day grid (00/06/12/18) for maximum
  # separation between every job on the single shared mover node. ---
  - app: home-assistant
    capacity: 10Gi
    cacheCapacity: "5Gi"
    runAsUser: "1000"               # HA container runs as uid=1000; mover must match to read .storage/* files
    supplementalGroups: [1001]      # repo's own control/index files are group-owned 1001 (0600); non-1001 movers need this to read them
    schedule: "0 0 * * *"            # every day 00:00 — isolated, 6h clear before any other job

  # --- Sunday (3 apps, 6h-spaced across full day) ---
  - app: zwavejs2mqtt
    schedule: "0 6 * * 0"            # Sunday 06:00

  - app: streambox
    pvcSuffix: data
    schedule: "0 12 * * 0"           # Sunday 12:00

  # --- Monday (3 apps, 6h-spaced across full day) ---
  - app: node-red
    pvcSuffix: data
    capacity: 5Gi
    schedule: "0 6 * * 1"            # Monday 06:00

  - app: esphome
    schedule: "0 12 * * 1"           # Monday 12:00
    runAsUser: "2000"               # esphome device-builder files owned by uid 2000; other-owned files are world-readable (o+r)
    supplementalGroups: [1001]      # repo's own control/index files are group-owned 1001 (0600); non-1001 movers need this to read them

  - app: manyfold
    pvcSuffix: data
    capacity: 5Gi
    schedule: "0 18 * * 1"           # Monday 18:00

  # --- Tuesday (3 apps, 6h-spaced across full day) ---
  - app: actual
    pvcSuffix: data
    capacity: 5Gi
    schedule: "0 6 * * 2"            # Tuesday 06:00

  - app: planka
    pvcSuffix: data
    schedule: "0 12 * * 2"           # Tuesday 12:00

#  - app: paperless-ngx
#    pvcSuffix: data
#    capacity: 5Gi
#    schedule: "0 18 * * 2"           # Tuesday 18:00

  # --- Wednesday (3 apps incl. forgejo, 6h-spaced across full day) ---
  - app: uptime-kuma
    pvcSuffix: data
    capacity: 5Gi
    namespace: monitoring
    schedule: "0 6 * * 3"            # Wednesday 06:00

  - app: pocket-id
    pvcSuffix: data
    namespace: kube-system
    schedule: "0 12 * * 3"           # Wednesday 12:00

  # --- Thursday (3 apps, 6h-spaced across full day) ---
  - app: zigbee2mqtt
    schedule: "0 6 * * 4"            # Thursday 06:00

  - app: frigate
    capacity: 10Gi
    schedule: "0 12 * * 4"           # Thursday 12:00

  - app: webtrees
    schedule: "0 18 * * 4"           # Thursday 18:00
    runAsUser: "33"                  # webtrees data owned by www-data (uid 33); config.ini.php is 0700
    supplementalGroups: [1001]      # repo's own control/index files are group-owned 1001 (0600); non-1001 movers need this to read them

#  # --- Friday (3 apps incl. forgejo, 6h-spaced across full day) ---
#  - app: matter-server
#    pvcSuffix: data
#    schedule: "0 6 * * 5"            # Friday 06:00
#    runAsUser: "0"                   # matter-server itself runs as root (see main/homelab/matter-server); mover must match

  - app: mealie
    pvcSuffix: api-data
    schedule: "0 12 * * 5"           # Friday 12:00

  # --- Saturday (2 apps, 6h-spaced across full day) ---
  - app: ss-models
    pvcSuffix: data
    capacity: 10Gi
    cacheCapacity: "5Gi"
    schedule: "0 6 * * 6"            # Saturday 06:00

  - app: jellyfin
    capacity: 3Gi
    schedule: "0 12 * * 6"           # Saturday 12:00 (moved off Friday so forgejo fits the 3-slot grid there)

  # --- Forgejo (3x/week, big PVC — backup can run well over an hour, so it
  # gets the last slot of the day (18:00) on Sun/Wed/Fri, with a 6h gap
  # before it and 6h before the next day's home-assistant run. ---
  - app: forgejo
    capacity: 10Gi
    cacheCapacity: "5Gi"
    runAsUser: "1000"               # forgejo /data owned by uid=1000 (git); matches so mover can read git/.ssh (0700) too
    supplementalGroups: [1001]      # repo's own control/index files are group-owned 1001 (0600); non-1001 movers need this to read them
    schedule: "0 18 * * 0,3,5"       # Sunday, Wednesday, Friday at 18:00 (last job of the day)
