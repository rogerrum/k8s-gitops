# Kopiur backup configuration
# createPVCs: false = only SnapshotPolicy/Schedule (existing VolSync PVCs untouched)
# createPVCs: true  = also manage PVC bootstrap via Restore populator
createPVCs: false

defaults:
  pvcSuffix: config
  runAsUser: "1001"
  capacity: 1Gi
  cacheCapacity: "3Gi"
  # H = Jenkins-style cron: kopiur hashes a stable per-app minute for load distribution
  schedule: "H * * * *"
  namespace: default

# PHASE 1 PILOT — single low-risk app
# Verify identity adoption (actual@default:/data) before enabling all apps
# After pilot success: remove actual from volsync values.yaml, then uncomment all apps below
apps:
  - app: actual
    pvcSuffix: data
    capacity: 5Gi
    schedule: "H */4 * * *"

