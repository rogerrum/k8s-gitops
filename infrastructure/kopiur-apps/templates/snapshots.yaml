{{- $apps := include "kopiur.parseApps" . | fromJsonArray -}}
{{- range $apps }}
---
# SnapshotPolicy for {{ .app }}
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: {{ .app }}
  namespace: {{ .namespace }}
  labels:
    app.kubernetes.io/name: kopiur
    app.kubernetes.io/component: backup
    app.kubernetes.io/instance: {{ $.Release.Name }}
spec:
  repository:
    kind: ClusterRepository
    name: nas
  sources:
    - pvc:
        name: {{ .app }}-{{ .pvcSuffix }}
      # Matches the fork's recorded source path so adoption continues the
      # existing <app>@<namespace>:/data history instead of starting fresh.
      sourcePathOverride: /data
  copyMethod: Snapshot
  volumeSnapshotClassName: longhorn-snapshot-vsc
  # Raise staging timeout — Longhorn Garage S3 backup can take >10min for larger PVCs
  staging:
    timeout: 90m
  compression:
    compressor: zstd
  retention:
    keepHourly: 24
    keepDaily: 14
    keepWeekly: 8
    keepMonthly: 6
  # Verification TEMPORARILY DISABLED (2026-09-03): concurrent verify jobs'
  # Longhorn-backed kopia-cache PVCs (mode: Persistent, below) were churning
  # Longhorn hard enough to destabilize it cluster-wide (replica rebuilds,
  # manager readiness timeouts, volumes flapping detached/unknown), which in
  # turn starved the API server enough to crash-loop kopiur's own controller.
  # Re-enable once Longhorn is confirmed stable and cache is Ephemeral has
  # been running cleanly for a while. See scripts/UNWEDGE-NFS-NODE.md and
  # this session's checkpoint for the full incident writeup.
  # verification:
  #   quick:
  #     schedule:
  #       cron: "{{ .schedule }}"
  # Repository Secret lives in kube-system; movers run in the app's namespace
  credentialProjection:
    enabled: true
  mover:
    securityContext:
      runAsUser: {{ .runAsUser }}
      runAsGroup: {{ .runAsUser }}
    podSecurityContext:
      runAsNonRoot: {{ .runAsNonRoot }}
      fsGroup: {{ .runAsUser }}
      fsGroupChangePolicy: OnRootMismatch
      {{- if .supplementalGroups }}
      supplementalGroups: {{ .supplementalGroups | toJson }}
      {{- end }}
    cache:
      capacity: {{ .cacheCapacity }}
      storageClassName: longhorn
      # Changed Persistent -> Ephemeral (2026-09-03): a Persistent cache PVC
      # sticks around across mover runs; Ephemeral (a Kubernetes generic
      # ephemeral volume, still Longhorn-backed via storageClassName above)
      # is created fresh and deleted when each mover pod finishes, reducing
      # standing Longhorn volume count during tonight's Longhorn instability.
      mode: Ephemeral
      metadataCacheSizeMb: 400
      contentCacheSizeMb: 200
---
# SnapshotSchedule for {{ .app }}
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: {{ .app }}-scheduled
  namespace: {{ .namespace }}
  labels:
    app.kubernetes.io/name: kopiur
    app.kubernetes.io/component: backup
    app.kubernetes.io/instance: {{ $.Release.Name }}
spec:
  policyRef:
    name: {{ .app }}
  schedule:
    # Cron expression from values.yaml — explicit minute+hour per app, see
    # the schedule strategy comment there for how collisions are avoided.
    cron: "{{ .schedule }}"
    runOnCreate: false
    # Without this, kopiur fires every missed slot as a catch-up run instead
    # of skipping stale ones — editing the cron mid-day (or any prolonged
    # controller/node outage) otherwise produces a backlog of stale-schedule
    # Snapshots queued behind the single shared mover. 1h is generous enough
    # to tolerate normal single-mover queueing delays but bounds how far back
    # a catch-up can reach.
    startingDeadlineSeconds: 3600
{{- end }}
