apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: step-ca-bundle
  labels:
    app.kubernetes.io/instance: {{ $.Release.Name }}  # Add this!
    app.kubernetes.io/part-of: {{ $.Release.Name }}
spec:
  sources:
    - secret:
        name: step-ca-root-cert
        key: ca.crt
    # Needed so this bundle is a complete trust store (system/Mozilla roots +
    # step-ca), not just the step-ca cert alone. Node's NODE_EXTRA_CA_CERTS
    # only *appends* to its built-in bundle, so this didn't matter there, but
    # Go's SSL_CERT_FILE *replaces* the whole trust store -- renovate-operator
    # (a Go binary) needs the full set or it loses trust in every other host.
    - useDefaultCAs: true

  target:
    configMap:
      key: ca.crt
    namespaceSelector:
      matchLabels:
        trust: enabled
