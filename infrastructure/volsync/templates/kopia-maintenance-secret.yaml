apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopia-maintenance-secret
  labels:
    app.kubernetes.io/instance: {{ $.Release.Name }}  # Add this!
    app.kubernetes.io/part-of: {{ $.Release.Name }}
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kopia-maintenance-secret
    creationPolicy: Owner
    template:
      data:
        KOPIA_REPOSITORY: filesystem:///mnt/repository
        KOPIA_PASSWORD: '{{ printf "{{ .KOPIA_PASSWORD }}" }}'
        # The mover container's numeric UID (1000/1001) has no matching /etc/passwd
        # entry, so kopia's OS user lookup fails ("Cannot determine current user").
        # Override the identity explicitly so repository connect/maintenance
        # ownership checks use a stable, known identity instead of a derived one.
        KOPIA_OVERRIDE_USERNAME: volsync
        KOPIA_OVERRIDE_HOSTNAME: volsync-maintenance
  dataFrom:
    - extract:
        key: kopia-config
        # Ensure this key exists in 1Password with KOPIA_PASSWORD field
