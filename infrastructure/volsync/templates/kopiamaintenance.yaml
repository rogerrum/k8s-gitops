---
# KopiaMaintenance CRD for weekly repository maintenance
# NOTE: repository path is /Kopia/v2 (rebuilt fresh 2026-09-04) — see
# mutatingadmissionpolicy.yaml for the full rationale (old /Kopia repo had
# stuck maintenance-connect hangs after kopiur's forced ownership takeover).
apiVersion: volsync.backube/v1alpha1
kind: KopiaMaintenance
metadata:
  name: kopia-maintenance
  namespace: kube-system
  labels:
    app.kubernetes.io/name: volsync
    app.kubernetes.io/component: maintenance
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  moverVolumes:
    - mountPath: repository
      volumeSource:
        nfs:
          server: 192.168.1.115
          path: /Kopia/v2
  repository:
    repository: kopia-maintenance-secret
  schedule: "0 3 * * 0"  # Weekly Sunday at 3 AM
  activeDeadlineSeconds: 14400  # 4 hours for large repository first run
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - k8s-8-server
  cacheCapacity: 10Gi
  cacheAccessModes: ["ReadWriteOnce"]
  cacheStorageClassName: longhorn
