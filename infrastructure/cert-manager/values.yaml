cert-manager:
  crds:
    enabled: true
  webhook:
    tolerations:
      - key: "arm"
        operator: "Exists"
      - key: "arm64"
        operator: "Exists"
  extraArgs:
    - --dns01-recursive-nameservers=1.1.1.1:53
    - --dns01-recursive-nameservers-only
  tolerations:
    - key: "arm"
      operator: "Exists"
    - key: "arm64"
      operator: "Exists"
  cainjector:
    replicaCount: 1
    tolerations:
      - key: "arm"
        operator: "Exists"
      - key: "arm64"
        operator: "Exists"
  prometheus:
    enabled: true
    servicemonitor:
      enabled: true
      prometheusInstance: monitoring

# GrafanaDashboard CRs for this app, rendered via templates/grafanadashboard.yaml
grafanaDashboards:
  - name: cert-manager
    namespace: cert-manager
    allowCrossNamespaceImport: true
    folder: infrastructure
    # renovate: depName=20842
    url: https://grafana.com/api/dashboards/20842/revisions/3/download
    datasources:
      - inputName: DS_PROMETHEUS
        datasourceName: Prometheus
